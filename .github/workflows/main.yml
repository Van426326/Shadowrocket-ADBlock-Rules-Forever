name: Build Shadowrocket Rules

on:
  # 已停用定时/自动触发(仓库弃维护),仅保留手动 workflow_dispatch
  workflow_dispatch:
  
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install requirements
        run: pip3 install -r requirements.txt

      - name: Run auto-build.sh
        run: ./factory/auto_build.sh

      # 注意：不再从外部下载 lazy.conf/lazy_group.conf
      # 这两个文件已在本仓库 build 分支包含方案A DNS防泄露配置
      # 下载外部文件会覆盖 dns-server/fallback-dns-server/dns-direct-system 的修改

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          BRANCH: build
          FOLDER: .
          commit-message: 'Nightly build'

