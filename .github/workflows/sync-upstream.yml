name: Sync Upstream

# 每天自动同步上游仓库，也可以手动触发
on:
  schedule:
    # 每天 UTC 时间 02:00 运行（北京时间 10:00）
    - cron: '0 2 * * *'
  workflow_dispatch:  # 允许手动触发

# 添加必要的权限
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4
        with:
          ref: build          # 始终同步 build 分支（源码），而非 release（构建产物）
          fetch-depth: 0      # 获取完整历史记录

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 注册 ours merge driver，使 .gitattributes 中 merge=ours 的规则生效
          # readme.md 和 figure/** 标记了 merge=ours，合并时始终保留本仓库版本
          git config merge.ours.driver true

      - name: Add upstream remote and fetch
        run: |
          git remote add upstream https://github.com/Johnshall/Shadowrocket-ADBlock-Rules-Forever.git || true
          git fetch upstream

      - name: Merge upstream/build
        run: |
          # 合并上游 build 分支的最新改动（规则列表更新等）
          if git merge upstream/build --no-edit; then
            echo "Successfully merged upstream/build"
          else
            echo "Merge conflict detected, resolving..."

            # 只对含有我们 DNS 修复的文件保留 ours 版本
            # lazy.conf / lazy_group.conf：完整配置文件，我们有 DNS 修改
            # factory/template/sr_head.txt：生成 sr_*.conf 的模板头，我们加了 DNS 配置
            DNS_FILES="lazy.conf lazy_group.conf factory/template/sr_head.txt"
            git checkout --ours $DNS_FILES
            git add $DNS_FILES

            # 其余冲突文件（规则列表、其他模板等）全部接受上游版本
            CONFLICT_FILES=$(git diff --name-only --diff-filter=U)
            if [ -n "$CONFLICT_FILES" ]; then
              echo "Accepting upstream for: $CONFLICT_FILES"
              echo "$CONFLICT_FILES" | xargs git checkout --theirs --
              echo "$CONFLICT_FILES" | xargs git add
            fi

            git -c core.editor=true merge --continue
          fi

      - name: Push to origin/build
        run: git push origin build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
